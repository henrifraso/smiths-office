<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Smiths Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; font-family: monospace; }
    #canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #00ff88;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-shadow: 0 0 8px #00ff8880;
      pointer-events: none;
    }
    #hud .title { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    #hud .sub { color: #ffffff44; }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #00ff88;
      font-family: monospace;
      gap: 16px;
      z-index: 100;
    }
    #loading .logo { font-size: 20px; letter-spacing: 0.2em; }
    #loading .bar-wrap { width: 240px; height: 2px; background: #ffffff18; }
    #loading .bar { height: 100%; background: #00ff88; width: 0%; transition: width 0.2s; }
    #loading .pct { font-size: 11px; color: #ffffff55; margin-top: 6px; }

    #controls-hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      color: #ffffff33;
      font-size: 10px;
      text-align: right;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="logo">SMITHS CORPORATION</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="pct" id="pct">carregando modelo...</div>
</div>

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="title">SMITHS CORPORATION</div>
  <div class="sub">Smiths HQ · Alpha</div>
</div>

<div id="controls-hint">
  arrastar · scroll zoom · clique direito pan
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(12, 10, 14);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 2;
controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.target.set(0, 1, 0);

// Iluminação
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff5e0, 2.0);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 100;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xa0c8ff, 0.5);
fill.position.set(-8, 5, -5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x00ff88, 0.15);
rim.position.set(0, 3, -15);
scene.add(rim);

const loader = new GLTFLoader();

const bar = document.getElementById('bar');
const pct = document.getElementById('pct');
const loading = document.getElementById('loading');

loader.load(
  'police_office.glb',
  (gltf) => {
    const model = gltf.scene;

    // Sombras em tudo
    model.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;
      }
    });

    // Centralizar e escalar
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 10 / maxDim;

    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));

    scene.add(model);

    // Posicionar chão na base do modelo
    const scaledBox = new THREE.Box3().setFromObject(model);
    floor.position.y = scaledBox.min.y + 0.01;

    // Ajustar câmera para o modelo
    const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
    const scaledSize = scaledBox.getSize(new THREE.Vector3());
    const dist = Math.max(scaledSize.x, scaledSize.z) * 1.4;

    controls.target.copy(scaledCenter);
    camera.position.set(
      scaledCenter.x + dist,
      scaledCenter.y + dist * 0.6,
      scaledCenter.z + dist
    );
    controls.update();

    loading.style.display = 'none';
  },
  (progress) => {
    if (progress.total > 0) {
      const p = Math.round((progress.loaded / progress.total) * 100);
      bar.style.width = p + '%';
      pct.textContent = p + '% carregado';
    }
  },
  (err) => {
    pct.textContent = 'erro ao carregar: ' + err.message;
    console.error(err);
  }
);


// Chão de concreto
const floorCanvas = document.createElement('canvas');
floorCanvas.width = floorCanvas.height = 512;
const ctx = floorCanvas.getContext('2d');
ctx.fillStyle = '#7a7a78';
ctx.fillRect(0, 0, 512, 512);
for (let i = 0; i < 18000; i++) {
  const x = Math.random() * 512;
  const y = Math.random() * 512;
  const v = Math.floor(Math.random() * 40 - 20);
  const c = 122 + v;
  ctx.fillStyle = `rgba(${c},${c},${c-2},0.18)`;
  ctx.fillRect(x, y, Math.random() * 3 + 1, Math.random() * 3 + 1);
}
// linhas de juntas
ctx.strokeStyle = 'rgba(50,50,50,0.25)';
ctx.lineWidth = 1;
for (let i = 0; i <= 4; i++) {
  ctx.beginPath(); ctx.moveTo(i*128, 0); ctx.lineTo(i*128, 512); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, i*128); ctx.lineTo(512, i*128); ctx.stroke();
}
const floorTex = new THREE.CanvasTexture(floorCanvas);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(6, 6);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9, metalness: 0.0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
